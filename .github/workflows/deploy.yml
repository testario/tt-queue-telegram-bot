name: Deploy via SSH

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: tt-bot
    steps:
      - name: Check secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=0
          for v in VPS_HOST VPS_PORT VPS_USER VPS_APP_PATH VPS_SSH_KEY; do
            if [ -z "${!v}" ]; then echo "Missing secret: $v"; missing=1; fi
          done
          [ $missing -eq 0 ]
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          key_raw="${{ secrets.VPS_SSH_KEY }}"
          # Восстанавливаем переводы строк, убираем CR
          key_fmt="$(printf '%s' "$key_raw" | perl -0777 -pe 's/\\n/\n/g' | tr -d '\r')"

          tmp_key=$(mktemp)
          printf '%s' "$key_fmt" > "$tmp_key"
          chmod 600 "$tmp_key"

          # Если формат не читается, пробуем base64-декод
          if ! ssh-keygen -y -f "$tmp_key" >/dev/null 2>&1; then
            decoded="$(printf '%s' "$key_fmt" | base64 -d 2>/dev/null || true)"
            if [ -n "$decoded" ]; then
              printf '%s' "$decoded" > "$tmp_key"
              chmod 600 "$tmp_key"
            fi
          fi

          # Базовая диагностика до финальной проверки
          echo "key bytes: $(wc -c < "$tmp_key")"
          echo "key lines: $(wc -l < "$tmp_key")"
          echo "key head: $(head -n1 "$tmp_key")"
          echo "key tail: $(tail -n1 "$tmp_key")"

          # Финальная проверка с выводом ошибки
          if ! ssh-keygen -y -f "$tmp_key" >/dev/null 2>sshkey.err; then
            echo "Invalid VPS_SSH_KEY format"
            cat sshkey.err
            exit 1
          fi
          rm -f sshkey.err

          mv "$tmp_key" ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Debug SSH key
        run: |
          set -e
          ls -l ~/.ssh/id_rsa
          echo "bytes: $(wc -c < ~/.ssh/id_rsa)"
          echo "lines: $(wc -l < ~/.ssh/id_rsa)"
          echo "head: $(head -n1 ~/.ssh/id_rsa)"
          echo "tail: $(tail -n1 ~/.ssh/id_rsa)"
          ssh-keygen -lf ~/.ssh/id_rsa

      - name: Deploy & restart
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" << 'EOF'
          set -e

          cd "$VPS_APP_PATH"

          git fetch origin master
          git checkout master
          git pull --ff-only

          npm ci
          npm test

          command -v pm2 >/dev/null 2>&1 || npm i -g pm2

          pm2 stop tt-queue-bot || true

          NODE_ENV=production pm2 start -a -l pm2.log -o out.log -e err.log --name tt-queue-bot src/index.js
          EOF