name: tt-queue-bot-dev

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: tt-queue-bot
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Локальный HTTP-прокси до Telegram API (api.telegram.org заблокирован в
  # РФ на уровне сети). По умолчанию outbound = freedom (прямое подключение,
  # no-op) — см. xray/README.md, как подключить реальный туннель.
  xray:
    image: ghcr.io/xtls/xray-core:latest
    restart: unless-stopped
    volumes:
      - ./xray/config.json:/usr/local/etc/xray/config.json:ro
    networks:
      - internal

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      PLAYERS_MONGODB_URI: mongodb://mongodb:27017
      PLAYERS_MONGODB_DB: tt-queue-bot
      PLAYERS_MONGODB_COLLECTION: players
      HTTP_PROXY: http://xray:1080
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      xray:
        condition: service_started
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      PLAYERS_MONGODB_URI: mongodb://mongodb:27017
      PLAYERS_MONGODB_DB: tt-queue-bot
      PLAYERS_MONGODB_COLLECTION: players
      WEBAPP_PORT: 3000
      HTTP_PROXY: http://xray:1080
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      xray:
        condition: service_started
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
    networks:
      - internal

networks:
  internal:
    driver: bridge
