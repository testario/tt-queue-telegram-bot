server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker может назначить backend новый IP при пересоздании контейнера.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Ассеты мини-приложения: Vite ссылается на /app/assets/..., но файлы лежат в /assets/
    location /app/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Редирект /app → /app/ (без слэша)
    location = /app {
        return 301 /app/;
    }

    # Мини-приложение — всегда отдаём SPA index.html
    location /app/ {
        try_files /index.html =404;
    }

    # API + SSE — проксируем к backend-сервису
    location /api/ {
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE: обязательно отключаем буферизацию
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # Всё остальное (включая /) — лендинг
    location / {
        try_files $uri /landing.html;
    }
}
